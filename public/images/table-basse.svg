<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f7ee"/>
      <stop offset="100%" style="stop-color:#d8edcf"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)" rx="12"/>
  <!-- Table shadow -->
  <ellipse cx="300" cy="295" rx="200" ry="18" fill="#1a3a16" opacity="0.15"/>
  <!-- Table top -->
  <rect x="90" y="185" width="420" height="32" rx="8" fill="#5c3d1e"/>
  <!-- Wood grain -->
  <line x1="130" y1="185" x2="130" y2="217" stroke="#7a5230" stroke-width="2" opacity="0.5"/>
  <line x1="200" y1="185" x2="200" y2="217" stroke="#7a5230" stroke-width="2" opacity="0.5"/>
  <line x1="300" y1="185" x2="300" y2="217" stroke="#7a5230" stroke-width="2" opacity="0.5"/>
  <line x1="400" y1="185" x2="400" y2="217" stroke="#7a5230" stroke-width="2" opacity="0.5"/>
  <line x1="470" y1="185" x2="470" y2="217" stroke="#7a5230" stroke-width="2" opacity="0.5"/>
  <!-- Legs -->
  <rect x="115" y="217" width="22" height="70" rx="4" fill="#4a2e12"/>
  <rect x="463" y="217" width="22" height="70" rx="4" fill="#4a2e12"/>
  <!-- Cross bar -->
  <rect x="137" y="260" width="326" height="10" rx="4" fill="#3d2510"/>
  <!-- Label -->
  <rect x="165" y="320" width="270" height="32" rx="6" fill="#5c3d1e" opacity="0.15"/>
  <text x="300" y="341" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#5c3d1e">Table basse chêne</text>
</svg>
