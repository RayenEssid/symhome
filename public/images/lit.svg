  <rect x="320" y="220" width="170" height="45" rx="10" fill="#ddeaf5"/>
  <!-- Duvet -->
  <rect x="90" y="258" width="420" height="27" rx="6" fill="#c5d8ee"/>
  <!-- Legs -->
  <rect x="105" y="302" width="16" height="30" rx="4" fill="#2a4460"/>
  <rect x="479" y="302" width="16" height="30" rx="4" fill="#2a4460"/>
