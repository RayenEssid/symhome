  </defs>
  <rect width="600" height="400" fill="url(#bg)" rx="12"/>
  <!-- Headboard -->
  <rect x="80" y="140" width="440" height="90" rx="16" fill="#5b7fa6"/>
  <!-- Headboard detail -->
  <rect x="100" y="155" width="195" height="60" rx="10" fill="#7499c0" opacity="0.6"/>
  <rect x="305" y="155" width="195" height="60" rx="10" fill="#7499c0" opacity="0.6"/>
  <!-- Bed frame -->
